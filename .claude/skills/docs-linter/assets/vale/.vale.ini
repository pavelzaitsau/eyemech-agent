StylesPath = styles
MinAlertLevel = warning
Vocab = Project

[*.md]
# Vale must be listed here for the Project vocabulary to fire. Without it,
# accept.txt and reject.txt are dead config that looks like it works.
BasedOnStyles = Vale, Docs
Vale.Spelling = NO

# Fenced blocks and inline code spans are exempt. A style rule therefore
# cites the wording it bans inside backticks, or it trips itself.
BlockIgnores = (?s) *(```.*?```)
TokenIgnores = (\x60[^\n\x60]+\x60)
